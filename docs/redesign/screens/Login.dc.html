<style>
*{box-sizing:border-box}
body{margin:0;background:#0f1322}
.app{display:flex;flex-wrap:wrap;min-height:820px;font-family:Onest,system-ui,sans-serif;color:#e8eaf2;background:radial-gradient(circle at 75% 0%,#1b2140,#0f1322 55%)}
.side{flex:1 1 260px;max-width:260px;padding:24px 16px;display:flex;flex-direction:column;gap:24px;background:#0c1020;border-right:1px solid rgba(255,255,255,.07)}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1.2;color:#fff;text-decoration:none;padding:0 8px}
.brand span{background:linear-gradient(90deg,#7f7bff,#4df2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:#9aa3b8;text-decoration:none;font-size:14px;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:rgba(127,123,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(127,123,255,.35)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sfoot{margin-top:auto;padding:0 8px;font-size:12px;color:#7d869b}
.main{flex:999 1 560px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid transparent;font:600 14px Onest,system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn-p{background:#8b87ff;color:#0f1322}
.btn-p:hover{background:#a19eff}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;font-weight:600;color:#c9cfdd}
.field input{height:48px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#0f1322;color:#fff;font:400 15px Onest,system-ui,sans-serif}
.field input::placeholder{color:#7d869b}
.field input:focus{outline:2px solid #8b87ff;outline-offset:1px;border-color:transparent}
a:focus-visible,button:focus-visible{outline:2px solid #4df2ff;outline-offset:2px}
</style>
</helmet>
<div class="app">
  <aside class="side">
    <a class="brand" href="Main.dc.html">Heroes Of The Brain <span>2026</span></a>
    <nav class="nav" aria-label="Main">
      <a href="Info.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>Info</a>
      <a class="on" href="Login.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>Login</a>
    </nav>
    <div class="sfoot">© 2026 KN Neuron</div>

  <main class="main" style="display:flex;align-items:center;justify-content:center;padding:48px 24px">
    <form style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:20px;background:#151a2c;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:36px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6)">
      <div style="display:flex;flex-direction:column;gap:8px">
        <h1 style="margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;color:#fff">Log in</h1>
        <p style="margin:0;font-size:14px;line-height:1.5;color:#9aa3b8">Don't have an e-mail and password? Contact the organizers on Discord.</p>
      </div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" autocomplete="username"></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" placeholder="Password" autocomplete="current-password"></div>
      <div role="alert" style="display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.35);color:#ffb4b4;font-size:14px;line-height:1.4">
        <svg viewBox="0 0 24 24" width="18" height="18" style="flex:none;margin-top:1px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        Wrong e-mail or password.
      </div>
      <button class="btn btn-p" type="button" style="width:100%;min-height:48px">Log in</button>
    </form>
  </main>
